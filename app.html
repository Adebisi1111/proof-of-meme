<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof-of-Meme | App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; padding: 1rem; }
        .back { color: #888; text-decoration: none; font-size: 0.85rem; display: block; margin-bottom: 1rem; }
        h1 { font-size: 1.4rem; color: #00d4aa; margin-bottom: 0.25rem; }
        .subtitle { color: #666; margin-bottom: 1rem; font-size: 0.8rem; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab { flex: 1; padding: 0.5rem; text-align: center; cursor: pointer; color: #888; border: 1px solid #2a2a3a; border-radius: 6px; font-size: 0.85rem; }
        .tab.active { color: #00d4aa; border-color: #00d4aa; background: #00d4aa11; }
        .card { display: none; }
        .card.active { display: block; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.2rem; margin-top: 0.6rem; }
        input, textarea { width: 100%; padding: 0.6rem; background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; }
        input:focus, textarea:focus { outline: none; border-color: #00d4aa; }
        textarea { resize: vertical; min-height: 50px; }
        button { width: 100%; padding: 0.7rem; background: linear-gradient(135deg, #00d4aa, #7c3aed); color: white; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 0.75rem; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .status { padding: 0.6rem; background: #0a0a0f; border-radius: 6px; margin-top: 0.5rem; font-size: 0.8rem; word-break: break-all; }
        .status.success { color: #00d4aa; border: 1px solid #00d4aa33; }
        .status.error { color: #ff6b6b; border: 1px solid #ff6b6b33; }
        .status.pending { color: #ffd93d; border: 1px solid #ffd93d33; }
        a { color: #00d4aa; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Home</a>
        <h1>Proof-of-Meme</h1>
        <p class="subtitle">AI-Verified Viral Meme Bounties</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('create')">Create</div>
            <div class="tab" onclick="switchTab('submit')">Submit</div>
            <div class="tab" onclick="switchTab('view')">View</div>
        </div>

        <div id="create" class="card active">
            <label>Project Token</label>
            <input id="project" placeholder="DOGE">
            <label>Description</label>
            <textarea id="desc" rows="2" placeholder="Create a viral DOGE meme"></textarea>
            <label>Reward (GEN)</label>
            <input id="reward" type="number" placeholder="0.01" step="0.001">
            <label>Min Engagement</label>
            <input id="min-eng" type="number" placeholder="500">
            <button onclick="createBounty()">Create Bounty</button>
            <div id="create-status" class="status" style="display:none;"></div>
        </div>

        <div id="submit" class="card">
            <label>Bounty ID</label>
            <input id="bounty-id" type="number" placeholder="0">
            <label>Post URL</label>
            <input id="post-url" placeholder="https://twitter.com/...">
            <button onclick="submitMeme()">Submit Meme</button>
            <div id="submit-status" class="status" style="display:none;"></div>
        </div>

        <div id="view" class="card">
            <label>Bounty ID</label>
            <input id="view-id" type="number" placeholder="0">
            <button onclick="viewBounty()">View</button>
            <div id="view-result" class="status" style="display:none;"></div>
        </div>
    </div>

    <script>
    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
        document.getElementById(name).classList.add('active');
    }

    const API = 'https://proof-of-meme.onrender.com';

    async function createBounty() {
        const project = document.getElementById('project').value;
        const desc = document.getElementById('desc').value;
        const reward = document.getElementById('reward').value;
        const minEng = document.getElementById('min-eng').value;
        
        if (!project || !desc || !reward) return alert('Fill all fields');

        showStatus('create-status', 'Creating...', 'pending');

        try {
            const res = await fetch(`${API}/api/create-bounty`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    project_token: project,
                    description: desc,
                    min_engagement: parseInt(minEng) || 500,
                    value: Math.floor(parseFloat(reward) * 1e18)
                })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                showStatus('create-status', `✅ Created!<br><a href="https://explorer-bradbury.genlayer.com/tx/${data.tx_hash}" target="_blank">View TX</a>`, 'success');
            } else {
                showStatus('create-status', `❌ ${data.detail}`, 'error');
            }
        } catch (e) {
            showStatus('create-status', `❌ ${e.message}`, 'error');
        }
    }

    async function submitMeme() {
        const bountyId = document.getElementById('bounty-id').value;
        const postUrl = document.getElementById('post-url').value;
        
        if (bountyId === '' || !postUrl) return alert('Fill all fields');

        showStatus('submit-status', 'Submitting... (2-3 min)', 'pending');

        try {
            const res = await fetch(`${API}/api/submit-meme`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bounty_id: parseInt(bountyId), post_url: postUrl })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                const bounty = data.bounty;
                const approved = bounty.status === 'COMPLETED';
                showStatus('submit-status', `${approved ? '✅ Approved!' : '❌ Rejected'}<br><a href="https://explorer-bradbury.genlayer.com/tx/${data.tx_hash}" target="_blank">View TX</a>`, approved ? 'success' : 'error');
            } else if (data.status === 'pending') {
                showStatus('submit-status', `⏳ ${data.message}`, 'pending');
            } else {
                showStatus('submit-status', `❌ ${data.detail}`, 'error');
            }
        } catch (e) {
            showStatus('submit-status', `❌ ${e.message}`, 'error');
        }
    }

    async function viewBounty() {
        const id = document.getElementById('view-id').value;
        
        try {
            const res = await fetch(`${API}/bounty/${id}`);
            const data = await res.json();
            
            if (data.error) return showStatus('view-result', `❌ ${data.error}`, 'error');

            let html = `<strong>${data.project_token}</strong> — ${data.status}<br>`;
            html += `${data.description}<br>`;
            html += `Reward: ${(data.amount / 1e18).toFixed(4)} GEN<br>`;
            if (data.submissions?.length > 0) {
                data.submissions.forEach(s => {
                    html += `• <a href="${s.url}" target="_blank">${s.url.slice(0,30)}...</a> ${s.approved ? '✅' : '❌'}<br>`;
                });
            }
            showStatus('view-result', html, 'success');
        } catch (e) {
            showStatus('view-result', `❌ ${e.message}`, 'error');
        }
    }

    function showStatus(id, msg, type) {
        const el = document.getElementById(id);
        el.className = 'status ' + type;
        el.innerHTML = msg;
        el.style.display = 'block';
    }
    </script>
</body>
</html>
