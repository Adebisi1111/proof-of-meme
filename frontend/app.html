<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof-of-Meme | App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
        .back { color: #888; text-decoration: none; display: block; margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; color: #00d4aa; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #2a2a3a; }
        .tab { padding: 0.75rem 0; cursor: pointer; color: #888; border-bottom: 2px solid transparent; }
        .tab.active { color: #00d4aa; border-bottom-color: #00d4aa; }
        .card { background: #151520; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; display: none; }
        .card.active { display: block; }
        .card h2 { font-size: 1.1rem; color: #00d4aa; margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.3rem; margin-top: 0.8rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 8px; color: #e0e0e0; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: #00d4aa; }
        button { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #00d4aa, #7c3aed); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .status { padding: 0.75rem; background: #0a0a0f; border-radius: 8px; margin-top: 0.8rem; font-size: 0.85rem; word-break: break-all; }
        .status.success { color: #00d4aa; border: 1px solid #00d4aa33; }
        .status.error { color: #ff6b6b; border: 1px solid #ff6b6b33; }
        .status.pending { color: #ffd93d; border: 1px solid #ffd93d33; }
        a { color: #00d4aa; text-decoration: none; }
        .step { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .step-num { width: 24px; height: 24px; background: #00d4aa; color: #0a0a0f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back to Home</a>
        <h1>Proof-of-Meme</h1>
        <p class="subtitle">AI-Verified Viral Meme Bounties — GenLayer Bradbury</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('create')">Create</div>
            <div class="tab" onclick="switchTab('submit')">Submit</div>
            <div class="tab" onclick="switchTab('view')">View</div>
        </div>

        <!-- Create Bounty -->
        <div id="create" class="card active">
            <h2>Create Bounty</h2>
            <div class="step"><span class="step-num">1</span> Project token (e.g., DOGE)</div>
            <input id="project" placeholder="DOGE">
            <div class="step"><span class="step-num">2</span> Description</div>
            <textarea id="desc" rows="2" placeholder="Create a viral meme about DOGE"></textarea>
            <div class="step"><span class="step-num">3</span> Reward (GEN)</div>
            <input id="reward" type="number" placeholder="0.01" step="0.001">
            <div class="step"><span class="step-num">4</span> Min engagement</div>
            <input id="min-eng" type="number" placeholder="500">
            <button onclick="createBounty()">Create Bounty</button>
            <div id="create-status" class="status" style="display:none;"></div>
        </div>

        <!-- Submit Meme -->
        <div id="submit" class="card">
            <h2>Submit Meme</h2>
            <div class="step"><span class="step-num">1</span> Bounty ID</div>
            <input id="bounty-id" type="number" placeholder="0">
            <div class="step"><span class="step-num">2</span> Post URL</div>
            <input id="post-url" placeholder="https://twitter.com/...">
            <button onclick="submitMeme()">Submit Meme</button>
            <div id="submit-status" class="status" style="display:none;"></div>
        </div>

        <!-- View Bounty -->
        <div id="view" class="card">
            <h2>View Bounty</h2>
            <div class="step"><span class="step-num">1</span> Bounty ID</div>
            <input id="view-id" type="number" placeholder="0">
            <button onclick="viewBounty()">View</button>
            <div id="view-result" class="status" style="display:none;"></div>
        </div>
    </div>

    <script>
    function switchTab(name) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
        document.getElementById(name).classList.add('active');
    }

    const API = window.location.origin;

    async function createBounty() {
        const project = document.getElementById('project').value;
        const desc = document.getElementById('desc').value;
        const reward = document.getElementById('reward').value;
        const minEng = document.getElementById('min-eng').value;
        
        if (!project || !desc || !reward) {
            alert('Fill all fields');
            return;
        }

        showStatus('create-status', 'Creating...', 'pending');

        try {
            const res = await fetch(`${API}/api/create-bounty`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    project_token: project,
                    description: desc,
                    min_engagement: parseInt(minEng) || 500,
                    value: Math.floor(parseFloat(reward) * 1e18)
                })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                showStatus('create-status', `✅ Bounty created!<br>Tx: <a href="https://explorer-bradbury.genlayer.com/tx/${data.tx_hash}" target="_blank">${data.tx_hash.slice(0,10)}...</a>`, 'success');
            } else {
                showStatus('create-status', `❌ ${data.detail}`, 'error');
            }
        } catch (e) {
            showStatus('create-status', `❌ ${e.message}`, 'error');
        }
    }

    async function submitMeme() {
        const bountyId = document.getElementById('bounty-id').value;
        const postUrl = document.getElementById('post-url').value;
        
        if (bountyId === '' || !postUrl) {
            alert('Fill all fields');
            return;
        }

        showStatus('submit-status', 'Submitting... (AI verification takes 2-3 min)', 'pending');

        try {
            const res = await fetch(`${API}/api/submit-meme`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bounty_id: parseInt(bountyId),
                    post_url: postUrl
                })
            });
            const data = await res.json();
            
            if (data.status === 'success') {
                const bounty = data.bounty;
                const approved = bounty.status === 'COMPLETED';
                showStatus('submit-status', 
                    `${approved ? '✅ Approved & Paid!' : '❌ Rejected'}<br>` +
                    `${bounty.submissions?.[bounty.submissions.length-1]?.reasoning || ''}` +
                    `<br>Tx: <a href="https://explorer-bradbury.genlayer.com/tx/${data.tx_hash}" target="_blank">${data.tx_hash.slice(0,10)}...</a>`,
                    approved ? 'success' : 'error'
                );
            } else if (data.status === 'pending') {
                showStatus('submit-status', `⏳ ${data.message}`, 'pending');
            } else {
                showStatus('submit-status', `❌ ${data.detail}`, 'error');
            }
        } catch (e) {
            showStatus('submit-status', `❌ ${e.message}`, 'error');
        }
    }

    async function viewBounty() {
        const id = document.getElementById('view-id').value;
        
        try {
            const res = await fetch(`${API}/api/bounty/${id}`);
            const data = await res.json();
            
            if (data.error) {
                showStatus('view-result', `❌ ${data.error}`, 'error');
                return;
            }

            let html = `<strong>${data.project_token}</strong> - ${data.status}<br>`;
            html += `${data.description}<br>`;
            html += `Reward: ${(data.amount / 1e18).toFixed(4)} GEN<br>`;
            if (data.submissions?.length > 0) {
                html += '<strong>Submissions:</strong><br>';
                data.submissions.forEach(s => {
                    html += `- <a href="${s.url}" target="_blank">${s.url.slice(0,40)}...</a> [${s.approved ? '✅' : '❌'}]<br>`;
                });
            }
            showStatus('view-result', html, 'success');
        } catch (e) {
            showStatus('view-result', `❌ ${e.message}`, 'error');
        }
    }

    function showStatus(id, msg, type) {
        const el = document.getElementById(id);
        el.className = 'status ' + type;
        el.innerHTML = msg;
        el.style.display = 'block';
    }
    </script>
</body>
</html>
