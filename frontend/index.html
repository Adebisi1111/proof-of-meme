<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proof-of-Meme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
        .center { text-align: center; max-width: 360px; }
        h1 { font-size: 1.8rem; background: linear-gradient(135deg, #00d4aa, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .tagline { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
        .features { text-align: left; margin-bottom: 2rem; }
        .feat { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.85rem; color: #ccc; }
        .feat span { color: #00d4aa; }
        .cta { display: inline-block; padding: 0.75rem 2rem; background: linear-gradient(135deg, #00d4aa, #7c3aed); color: white; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="center">
        <h1>Proof-of-Meme</h1>
        <p class="tagline">AI-Verified Viral Meme Bounties</p>
        <div class="features">
            <div class="feat"><span>→</span> Post bounties with GEN rewards</div>
            <div class="feat"><span>→</span> Submit viral memes</div>
            <div class="feat"><span>→</span> AI verifies & pays instantly</div>
        </div>
        <a href="app.html" class="cta">Open App</a>
    </div>
</body>
</html>
